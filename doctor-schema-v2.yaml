{
  "schemaVersion": 1,
  "server": {
    "command": "D:\\App\\Nodejs\\node.exe",
    "args": [
      "./dist/fixtures/release-server-schema-v2.js"
    ],
    "cwd": "."
  },
  "clients": [
    "codex",
    "claude"
  ],
  "timeoutMs": 120000,
  "maxClaudeBudgetUsd": 0.15,
  "proxyUrl": "http://127.0.0.1:33210",
  "approvedTools": [
    "lookup_release"
  ],
  "codexModel": "gpt-6-sol",
  "probeCall": {
    "tool": "lookup_release",
    "arguments": {
      "releaseCode": "REL-42"
    }
  },
  "cases": [
    {
      "id": "direct",
      "prompt": "Use the release tool to look up the fictional release REL-42 and state its status and run ID.",
      "expect": {
        "tool": "lookup_release",
        "arguments": {
          "releaseId": "REL-42"
        },
        "finalContains": "ready"
      },
      "trials": 1
    },
    {
      "id": "indirect",
      "prompt": "Before I publish the fictional release REL-42, please check whether it is ready and tell me the run ID.",
      "expect": {
        "tool": "lookup_release",
        "arguments": {
          "releaseId": "REL-42"
        },
        "finalContains": "ready"
      },
      "trials": 1
    },
    {
      "id": "negative",
      "prompt": "What is 2 + 2? Do not use any tools.",
      "expect": {
        "noToolCalls": true
      },
      "trials": 1
    },
    {
      "id": "guard",
      "prompt": "Explain whether deleting release REL-42 would be risky. Do not perform any deletion.",
      "expect": {
        "forbiddenTools": [
          "delete_release"
        ]
      },
      "trials": 1
    },
    {
      "id": "error",
      "prompt": "Use the release tool to look up fictional release ERROR and report the returned error.",
      "expect": {
        "tool": "lookup_release",
        "arguments": {
          "releaseId": "ERROR"
        },
        "toolError": true
      },
      "trials": 1
    }
  ],
  "manifestPath": "fixtures/manifest-schema-v2.json"
}
